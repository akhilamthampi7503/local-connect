<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Register | LocalConnect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #14452F;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #14452F;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0d2e1f;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .error {
            background: #fee;
            color: #c00;
            display: block;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
        .login-link a {
            color: #14452F;
            text-decoration: none;
            font-weight: 600;
        }
        .version {
            text-align: center;
            margin-top: 15px;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2> LocalConnect</h2>
        <div class="subtitle">Create your account</div>
       <form id="registerForm">
  <input id="username" placeholder="Username" required>
  <input id="email" placeholder="Email" required>
  <input id="password" type="password" placeholder="Password" required>
  <button>Register</button>
</form>

        
        <div id="message"></div>
        
        <div class="login-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
        <div class="version">
            Version 2.0 - Cache Fixed
        </div>
    </div>

   <script>
document.getElementById("registerForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const res = await fetch("/api/register", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      username: username.value,
      email: email.value,
      password: password.value
    })
  });

  const data = await res.json();
  alert(data.message);
});
</script>
</body>
</html>

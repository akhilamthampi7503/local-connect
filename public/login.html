<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LocalConnect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #14452F;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #0d2e1f;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .error {
            background: #fee;
            color: #c00;
            display: block;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
        }
        .register-link a {
            color: #14452F;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login to LocalConnect</h2>
      <form id="loginForm">
     <input id="identifier" placeholder="Email or Username" required>
     <input id="password" type="password" placeholder="Password" required>
     <button>Login</button>
       </form>
        <div id="message" class="message"></div>
        <div class="register-link">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>

    <script>
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const res = await fetch("/api/login", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      identifier: identifier.value,
      password: password.value
    })
  });

  const data = await res.json();

  if(data.redirect){
    window.location.href = data.redirect;
  } else {
    alert(data.message);
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Tourist Dashboard</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; }

    .card { background:white; padding:15px; margin:10px; border-radius:10px; }

    button {
      padding:8px;
      background:#007bff;
      color:white;
      border:none;
      cursor:pointer;
      border-radius:5px;
    }

    .popup {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.6);
      display:none;
      justify-content:center;
      align-items:center;
    }

    .popup-content {
      background:white;
      padding:20px;
      border-radius:10px;
      width:300px;
    }
  </style>
</head>
<body>

<h2>Tourist Dashboard</h2>

<!-- 🔍 Filters -->
<div class="card">
  <h3>Select Location</h3>

  <input type="text" id="district" placeholder="Enter District">

  <select id="state">
    <option value="Kerala">Kerala</option>
    <option value="Karnataka">Karnataka</option>
  </select>

  <button onclick="loadPlaces()">Search</button>
</div>

<!-- 📍 Places -->
<div class="card">
  <h3>Places</h3>
  <div id="places"></div>
</div>

<!-- 👤 PROFILE POPUP -->
<div class="popup" id="profilePopup">
  <div class="popup-content">
    <h3>Setup Profile</h3>

    <input id="name" placeholder="Full Name"><br><br>
    <input id="phone" placeholder="Phone"><br><br>
    <input id="districtInput" placeholder="District"><br><br>

    <button onclick="saveProfile()">Save</button>
  </div>
</div>

<script>
const token = localStorage.getItem("token");

window.onload = function() {
  checkProfile();
};

// 🔍 CHECK PROFILE
function checkProfile(){
  fetch("http://localhost:5000/api/tourist/profile", {
    headers:{ Authorization: token }
  })
  .then(res => res.json())
  .then(data => {
    if(!data || !data.full_name){
      document.getElementById("profilePopup").style.display = "flex";
    }
  });
}

// 💾 SAVE PROFILE
function saveProfile(){
  const body = {
    full_name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    district: document.getElementById("districtInput").value
  };

  fetch("http://localhost:5000/api/tourist/profile", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      Authorization: token
    },
    body: JSON.stringify(body)
  })
  .then(res=>res.json())
  .then(()=>{
    alert("Profile Saved!");
    document.getElementById("profilePopup").style.display="none";
  });
}

// 📍 LOAD PLACES
function loadPlaces(){
  const district = document.getElementById("district").value;
  const state = document.getElementById("state").value;

  fetch(`http://localhost:5000/api/places?district=${district}&state=${state}`)
  .then(res=>res.json())
  .then(data=>{
    let html = "";

    data.forEach(p=>{
      html += `
        <div class="card">
          <h4>${p.name}</h4>
          <p>${p.location}</p>

          <button onclick="viewGuides('${p.location}')">
            View Available Guides
          </button>
        </div>
      `;
    });

    document.getElementById("places").innerHTML = html;
  });
}

// 👨‍🏫 VIEW GUIDES
function viewGuides(location){
  fetch(`http://localhost:5000/api/tourist/guides?location=${location}`,{
    headers:{ Authorization: token }
  })
  .then(res=>res.json())
  .then(data=>{
    let msg = "Available Guides:\n";

    data.forEach(g=>{
      msg += `Guide ID: ${g.id} - ${g.location}\n`;
    });

    alert(msg);
  });
}
</script>

</body>
</html>
